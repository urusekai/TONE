<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TONE</title>
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/font.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <!-- 페이지 CSS -->
    <link rel="stylesheet" href="./css/profile-edit.css" />
    <script type="module" src="./js/main-player.js"></script>
  </head>

  <body>
    <!-- 컨테이너 -->
    <div class="app has-mini">
      <!-- 헤더 -->
      <header class="header">
        <button type="button" aria-label="홈으로 이동">
          <img src="./assets/icons/logo.svg" alt="로고" />
        </button>
        <button type="button" class="avatar-btn" aria-label="프로필 메뉴">
          <div class="avatar"></div>
        </button>
      </header>

      <!-- 페이지 내용 -->
      <main id="profile-page">
        <div class="profile-image-area">
          <div class="profile-image"></div>
          <button type="button" class="profile-color-btn">색상 변경</button>
        </div>

        <form class="register-form profile-form" method="post">
          <div class="form-input-box">
            <span><img src="./assets/icons/id.svg" alt="이메일" /></span>
            <input
              id="profile-email"
              name="email"
              type="email"
              placeholder="이메일을 입력하세요"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-input-box">
            <span><img src="./assets/icons/password.svg" alt="비밀번호" /></span>
            <input
              id="profile-password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력하세요"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-input-box">
            <span><img src="./assets/icons/password.svg" alt="비밀번호 확인" /></span>
            <input
              id="profile-password-confirm"
              name="passwordConfirm"
              type="password"
              placeholder="비밀번호를 다시 입력하세요"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-input-box">
            <span><img src="./assets/icons/id.svg" alt="닉네임" /></span>
            <input
              id="profile-nickname"
              name="nickname"
              type="text"
              placeholder="닉네임을 2 ~ 5자 내에 입력하세요"
              autocomplete="nickname"
              minlength="2"
              maxlength="5"
              required
            />
          </div>

          <button type="submit" class="form-submit-box">수정 완료</button>
        </form>
      </main>

      <!-- 미니플레이어 -->
      <section class="mini-player">
        <button type="button" class="mini-thumb">
          <img src="./assets/images/thumb.png" alt="앨범 커버" />
        </button>
        <div class="mini-body">
          <div class="mini-top">
            <p class="mini-title">Falling Behind</p>
            <div class="mini-actions">
              <button type="button" class="mini-btn">
                <img src="./assets/icons/like.svg" alt="좋아요" />
              </button>
              <button type="button" class="mini-btn is-playing">
                <img src="./assets/icons/play.svg" alt="재생" class="icon-play" />
                <img src="./assets/icons/pause.svg" alt="재생일시정지" class="icon-pause" />
              </button>
            </div>
          </div>
          <p class="mini-artist">Laufey</p>
          <div class="mini-progress">
            <div class="mini-progress-cover" style="--progress: 65%"></div>
          </div>
        </div>
      </section>

      <!-- 메인플레이어 -->
      <section class="main-player">
        <header class="main-player__header">
          <button type="button" class="main-player__back-btn">
            <img src="./assets/icons/arrow-down.svg" alt="메인플레이어 닫기" />
          </button>
          <div class="main-player__header-info">
            <p class="main-player__header-label">PLAYLIST</p>
            <p class="main-player__header-name">Color Name</p>
          </div>
          <button type="button" class="main-player__profile-btn" aria-label="프로필">
            <span class="main-player__profile-avatar"></span>
          </button>
        </header>
        <img src="./assets/images/thumb.png" alt="앨범커버" class="main-player__cover" />
        <div class="main-player__info">
          <p class="main-player__title">Falling Behind</p>
          <p class="main-player__artist">Laufey</p>
        </div>
        <div class="main-player__progress">
          <div class="main-player__progress-cover" style="--progress: 65%"></div>
        </div>
        <div class="main-player__time">
          <span>00:00</span>
          <span>00:00</span>
        </div>
        <div class="main-player__actions-top">
          <button type="button" class="main-player__prev-btn">
            <img src="./assets/icons/prev-song.svg" alt="이전곡" />
          </button>
          <button type="button" class="main-player__play-toggle-btn is-playing">
            <img src="./assets/icons/pause-circle.svg" alt="일시정지" />
            <img src="./assets/icons/play-circle.svg" alt="재생" />
          </button>
          <button type="button" class="main-player__next-btn">
            <img src="./assets/icons/next-song.svg" alt="다음곡" />
          </button>
        </div>
        <div class="main-player__actions-bottom">
          <button type="button" class="main-player__like-btn">
            <img src="./assets/icons/like.svg" alt="좋아요" />
            <img src="./assets/icons/like_full.svg" alt="좋아요" />
          </button>
          <button type="button" class="main-player__shuffle-btn">
            <img src="./assets/icons/shuffle.svg" alt="셔플" />
          </button>
          <button type="button" class="main-player__repeat-btn">
            <img src="./assets/icons/repeat.svg" alt="반복" />
          </button>
          <button type="button" class="main-player__add-btn">
            <img src="./assets/icons/add.svg" alt="좋아요" />
          </button>
        </div>
      </section>

      <!-- 하단바 -->
      <nav class="bottom-nav">
        <a class="nav-item" href="./index.html">
          <img src="./assets/icons/main.svg" alt="메인" />
          <img src="./assets/icons/main-active.svg" alt="메인" />
        </a>
        <a class="nav-item" href="./search.html">
          <img src="./assets/icons/search.svg" alt="검색" />
          <img src="./assets/icons/search-active.svg" alt="검색" />
        </a>
        <a class="nav-item" href="./calendar.html">
          <img src="./assets/icons/calendar.svg" alt="캘린더" />
          <img src="./assets/icons/calendar-active.svg" alt="캘린더" />
        </a>
        <a class="nav-item is-active" href="./my-page.html">
          <img src="./assets/icons/menu.svg" alt="전체메뉴" />
          <img src="./assets/icons/menu.svg" alt="전체메인" />
        </a>
      </nav>
    </div>
  </body>
</html>
