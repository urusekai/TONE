<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TONE</title>
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/font.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <!-- 페이지 전용 CSS -->
    <link rel="stylesheet" href="./css/register.css" />
    <link rel="stylesheet" href="./css/popup.css" />
  </head>
  <body>
    <div class="app layout-auth">
      <main id="register-page">
        <img class="logo" src="./assets/icons/logo-full.svg" alt="로고" />
        <form class="register-form" action="javascript:void(0);" method="post">
          <div class="form-input-box">
            <span><img src="./assets/icons/id.svg" alt="아이디" /></span>
            <input id="register-id" type="text" name="id" placeholder="아이디를 입력하세요" required />
            <button type="button" class="id-check">중복확인</button>
          </div>
          <div class="form-input-box">
            <span><img src="./assets/icons/id.svg" alt="이메일" /></span>
            <input type="email" name="email" placeholder="이메일을 입력하세요" required />
          </div>
          <div class="form-input-box">
            <span><img src="./assets/icons/password.svg" alt="비밀번호" /></span>
            <input type="password" name="pw" placeholder="비밀번호를 입력하세요" required />
          </div>
          <div class="form-input-box">
            <span><img src="./assets/icons/password.svg" alt="비밀번호확인" /></span>
            <input
              type="password"
              name="pw_confirm"
              placeholder="비밀번호를 다시 입력하세요"
              required
            />
          </div>
          <div class="form-input-box">
            <span><img src="./assets/icons/id.svg" alt="닉네임" /></span>
            <input
              type="text"
              name="name"
              placeholder="닉네임을 2 ~ 5자 내에 입력하세요"
              required
            />
          </div>
          <button type="submit" class="form-submit-box">회원가입</button>
        </form>
      </main>
    </div>
    <div id="duplicateModal" class="modal-overlay">
      <div class="modal-container">
        <h2 class="modal-header">중복확인</h2>
        <div class="modal-content-card">
          <p class="modal-body-text">
            <span class="highlight" id="duplicateIdText">admin</span> 아이디<br />
            이용가능 합니다.
          </p>
        </div>
        <button type="button" class="modal-confirm-btn" data-popup-close="duplicate">확인</button>
      </div>
    </div>

    <div id="profileModal" class="modal-overlay">
      <div class="modal-container">
        <div class="profile-main-circle" id="mainProfileCircle">+</div>
        <p class="helper-text">프로필 색상을 선택해주세요</p>
        <div class="modal-content-card">
          <div class="color-picker-container">
            <button type="button" class="color-circle color-pink" data-color="#FFB3BA"></button>
            <button type="button" class="color-circle color-purple" data-color="#BAE1FF"></button>
            <button type="button" class="color-circle color-blue" data-color="#B2E2F2"></button>
            <button type="button" class="color-circle color-orange" data-color="#FFDFBA"></button>
            <button type="button" class="color-circle color-green" data-color="#D4F1E9"></button>
          </div>
        </div>
        <button
          type="button"
          class="modal-confirm-btn"
          data-popup-close="profile"
          data-popup-confirm="true"
        >
          확인
        </button>
      </div>
    </div>

    <script src="./js/popup.js"></script>
    <script src="./js/register.js"></script>
  </body>
</html>
