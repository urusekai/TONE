<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TONE</title>
  <!-- 공통 CSS -->
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/font.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <!-- 페이지 CSS -->
  <link rel="stylesheet" href="./css/category.css" />
</head>

<body>
  <!-- 컨테이너 -->
  <div class="app has-tabs has-mini">
    <!-- 헤더 -->
    <header class="header">
      <button type="button">
        <img src="./assets/icons/logo.svg" alt="로고" />
      </button>
      <a href="javascript:void(0);">
        <div class="avatar"></div>
      </a>
    </header>

    <!-- 탭메뉴 -->
    <nav class="tabs">
      <a class="tab" href="javascript:void(0);">For You</a>
      <a class="tab" href="javascript:void(0);">차트</a>
      <a class="tab" href="javascript:void(0);">Palette Log</a>
      <a class="tab is-active" href="javascript:void(0);">카테고리</a>
    </nav>

    <!-- 페이지 내용 -->
    <main id="category-page" aria-label="Categories">
      <h1 class="cg-title">Categories</h1>

      <ul class="cg-list">
        <!-- Chill -->
        <li class="cg-item">
          <a class="cg-link" href="javascript:void(0);" aria-label="Chill 카테고리 보기">
            <div class="cg-grad" style="--c1:#EAF4F4; --c2:#F2F2EE; --c3:#DCEAE8;" aria-hidden="true"></div>

            <div class="cg-body">
              <div class="cg-top">
                <p class="cg-word">Chill</p>
              </div>

              <div class="cg-tags" aria-label="태그">
                <span class="cg-tag">#Lo-fi</span>
                <span class="cg-tag">#재즈</span>
                <span class="cg-tag">#어쿠스틱</span>
              </div>
            </div>
          </a>
        </li>

        <!-- Bright -->
        <li class="cg-item">
          <a class="cg-link" href="javascript:void(0);" aria-label="Bright 카테고리 보기">
            <div class="cg-grad" style="--c3:#FFF3B0; --c2:#A8E6CF; --c1:#CDE7F0;" aria-hidden="true"></div>

            <div class="cg-body">
              <div class="cg-top">
                <p class="cg-word">Bright</p>
              </div>

              <div class="cg-tags" aria-label="태그">
                <span class="cg-tag">#청량 K-POP</span>
                <span class="cg-tag">#썸</span>
                <span class="cg-tag" #>드라이브 팝</span>
              </div>
            </div>
          </a>
        </li>


        <!-- Energetic -->
        <li class="cg-item">
          <a class="cg-link" href="javascript:void(0);" aria-label="Energetic 카테고리 보기">
            <div class="cg-grad" style="--c1:#FF5E5B; --c2:#FF8E53; --c3:#FDC830;" aria-hidden="true"></div>

            <div class="cg-body">
              <div class="cg-top">
                <p class="cg-word">Energetic</p>
              </div>

              <div class="cg-tags" aria-label="태그">
                <span class="cg-tag">#댄스</span>
                <span class="cg-tag">#EDM</span>
                <span class="cg-tag">#아이돌</span>
              </div>
            </div>
          </a>
        </li>

        <!-- Emotional -->
        <li class="cg-item">
          <a class="cg-link" href="javascript:void(0);" aria-label="Emotional 카테고리 보기">
            <div class="cg-grad" style="--c1:#C08497;--c2:#8E7DBE;--c3:#D6CADD;;" aria-hidden="true"></div>

            <div class="cg-body">
              <div class="cg-top">
                <p class="cg-word">Emotional</p>
              </div>

              <div class="cg-tags" aria-label="태그">
                <span class="cg-tag">#발라드</span>
                <span class="cg-tag">#슬픈 힙합</span>
                <span class="cg-tag">#OST</span>
              </div>
            </div>
          </a>
        </li>

        <!-- Groovy -->
        <li class="cg-item">
          <a class="cg-link" href="javascript:void(0);" aria-label="Groovy 카테고리 보기">
            <div class="cg-grad" style="--c2:#1F6F78;--c1:#3BA7A0;--c3:#274C77;" aria-hidden="true"></div>

            <div class="cg-body">
              <div class="cg-top">
                <p class="cg-word">Groovy</p>
              </div>

              <div class="cg-tags" aria-label="태그">
                <span class="cg-tag">#R&amp;B</span>
                <span class="cg-tag">#시티팝</span>
                <span class="cg-tag">#네오소울</span>
              </div>
            </div>
          </a>
        </li>


        <!-- Intense -->
        <li class="cg-item">
          <a class="cg-link" href="javascript:void(0);" aria-label="Intense 카테고리 보기">
            <div class="cg-grad" style="--c3:#2B2D42; --c2:#8D314A; --c1:#3A0CA3;" aria-hidden="true"></div>

            <div class="cg-body">
              <div class="cg-top">
                <p class="cg-word">Intense</p>
              </div>

              <div class="cg-tags" aria-label="태그">
                <span class="cg-tag">#락</span>
                <span class="cg-tag">#Drill</span>
                <span class="cg-tag">#다크 EDM</span>
              </div>
            </div>
          </a>
        </li>
      </ul>
    </main>

    <!-- 미니플레이어 -->
    <section class="mini-player">
      <button type="button" class="mini-thumb">
        <img src="./assets/images/thumb.png" alt="앨범 커버" />
      </button>
      <div class="mini-body">
        <div class="mini-top">
          <p class="mini-title">Falling Behind</p>
          <div class="mini-actions">
            <button type="button" class="mini-btn">
              <img src="./assets/icons/like.svg" alt="좋아요" />
            </button>
            <button type="button" class="mini-btn is-playing">
              <img src="./assets/icons/play.svg" alt="재생" class="icon-play" />
              <img src="./assets/icons/pause.svg" alt="재생일시정지" class="icon-pause" />
            </button>
          </div>
        </div>
        <p class="mini-artist">Laufey</p>
        <div class="mini-progress">
          <div class="mini-progress-cover" style="--progress: 65%"></div>
        </div>
      </div>
    </section>

    <!-- 하단바 -->
    <nav class="bottom-nav">
      <a class="nav-item is-active" href="javascript:void(0);">
        <img src="./assets/icons/main.svg" alt="메인" />
        <img src="./assets/icons/main-active.svg" alt="메인" />
      </a>
      <a class="nav-item" href="javascript:void(0);">
        <img src="./assets/icons/search.svg" alt="검색" />
        <img src="./assets/icons/search-active.svg" alt="검색" />
      </a>
      <a class="nav-item" href="javascript:void(0);">
        <img src="./assets/icons/calender.svg" alt="캘린더" />
        <img src="./assets/icons/calender-active.svg" alt="캘린더" />
      </a>
      <a class="nav-item" href="javascript:void(0);">
        <img src="./assets/icons/menu.svg" alt="전체메뉴" />
        <img src="./assets/icons/menu.svg" alt="전체메인" />
      </a>
    </nav>
  </div>
  <script src="./js/category.js"></script>
</body>

</html>
